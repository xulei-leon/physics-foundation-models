[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "particleml-research"
version = "0.3.0"
description = "Reproducible ATLAS Open Data H-to-ZZ-to-four-lepton ML analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "particleML contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "awkward>=2.7,<3",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "matplotlib>=3.9,<4",
  "mplhep>=0.4,<1",
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "pyhf>=0.7.6,<1",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.7,<1.8",
  "scipy>=1.13,<1.16",
  "shap>=0.46,<1",
  "uproot>=5.4,<6",
  "xgboost>=2.1,<4",
]

[project.optional-dependencies]
ci = [
  "awkward>=2.7,<3",
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "matplotlib>=3.9,<4",
  "mplhep>=0.4,<1",
  "mypy>=1.14,<2",
  "numpy>=1.26,<2",
  "packaging>=26,<27",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "pyhf>=0.7.6,<1",
  "pyyaml>=6.0,<7",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "scikit-learn>=1.7,<1.8",
  "scipy>=1.13,<1.16",
  "shap>=0.46,<1",
  "types-jsonschema>=4.23,<5",
  "types-pyyaml>=6.0,<7",
  "uproot>=5.4,<6",
  "xgboost>=2.1,<4",
]

[project.scripts]
particleml = "particleml.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/particleml"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["src/particleml/**/*.py", "scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/particleml"]
